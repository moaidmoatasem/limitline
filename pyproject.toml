[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "limitline"
version = "2.12.0"
description = "Floating desktop monitor for Claude Code usage and plan limits (unofficial)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["claude", "claude-code", "usage", "monitor", "tkinter"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: X11 Applications",
  "Topic :: Utilities",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "Pillow>=9"]
demo = ["mss>=7.0", "numpy>=1.24"]
dev = ["ruff"]

[project.scripts]
limitline = "limitline:main"

[project.gui-scripts]
limitline-gui = "limitline:main"

[tool.setuptools]
py-modules = ["limitline"]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
ignore = ["E402", "E702", "F841", "E741", "E731", "SIM115", "I001", "PLW1510", "RUF015", "UP031", "BLE001", "ISC004", "RUF059", "RUF046", "S110", "RUF100", "DTZ006", "FURB136", "PIE808", "B023", "C408", "DTZ011", "PLC3002", "C405"]
