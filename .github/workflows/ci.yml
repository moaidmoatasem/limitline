name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile limitline.py
      - name: Core tests (no display needed)
        run: python tests/test_core.py
      - name: Self-test with a real window (Windows, macOS)
        if: runner.os != 'Linux'
        run: python limitline.py --selftest
      - name: Self-test with a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk xvfb
          xvfb-run -a python limitline.py --selftest
